# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group minor/patch updates for dev dependencies
      dev-dependencies:
        patterns:
          - "pytest*"
          - "pylint"
          - "flake8"
          - "ruff"
          - "mypy"
          - "bandit"
          - "types-*"
          - "*-stubs"
        update-types:
          - "minor"
          - "patch"
      # Group ADBC driver updates
      adbc:
        patterns:
          - "adbc-driver-*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group GitHub Actions updates
      actions:
        patterns:
          - "*"
