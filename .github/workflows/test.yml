name: Test code base

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
      - release-*
    tags:
      - v*

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_pip_install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Test pip install (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pip install
        run: |
          pip install .

  pytest-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Unit tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test]"
      - name: Run unit tests
        run: |
          pytest -s -m "unit or not (integration or cloud or slow)" --ignore=tests/test_main.py tests/

  pytest-integration:
    runs-on: ${{ matrix.os }}
    # A healthy run takes ~4 minutes. Windows runners occasionally freeze while
    # provisioning WSL (actions/runner-images#14938), where step timeouts don't
    # fire; cap the job so a frozen runner fails in 30 minutes, not hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Integration tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test]"

      # Linux and macOS both use the official cross-platform installer. The
      # Homebrew formula's post-install ("Upgrading Spice Runtime...") fails
      # intermittently on macOS runners, so brew is avoided here entirely.
      - name: Install Spice (https://install.spiceai.org) (Linux & macOS)
        if: matrix.os != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The installer download/extract flakes intermittently on CI runners,
          # so retry the two network steps before giving up (-f fails on HTTP errors).
          retry() {
            local n=1
            until "$@"; do
              [ $n -ge 3 ] && { echo "'$*' failed after $n attempts" >&2; return 1; }
              echo "attempt $n of '$*' failed; retrying in 5s..." >&2
              n=$((n + 1)); sleep 5
            done
          }
          retry bash -c 'curl -fsSL https://install.spiceai.org | bash'
          echo "$HOME/.spice/bin" >> $GITHUB_PATH
          retry "$HOME/.spice/bin/spice" install

      # Spice on Windows is only supported via WSL. Set up Ubuntu under WSL
      # and install Spice there; the tests on the Windows host then talk to
      # the runtime over localhost (WSL2 forwards localhost between host and
      # guest).
      - name: Set up WSL (Windows)
        if: matrix.os == 'windows-latest'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: |
            curl
            ca-certificates

      - name: install Spice in WSL (Windows)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry the install: the download/extract flakes intermittently in WSL
          # ("Failed to extract archive"). -f makes curl fail on HTTP errors.
          retry() {
            local n=1
            until "$@"; do
              [ $n -ge 3 ] && { echo "'$*' failed after $n attempts" >&2; return 1; }
              echo "attempt $n of '$*' failed; retrying in 5s..." >&2
              n=$((n + 1)); sleep 5
            done
          }
          retry bash -c 'curl -fsSL https://install.spiceai.org | bash'
          retry "$HOME/.spice/bin/spice" install

      - name: Init and start spice app
        if: matrix.os != 'windows-latest'
        run: |
          spice init spice_qs
          cd spice_qs
          # Define the dataset inline instead of `spice add spiceai/quickstart`.
          # Pulling it from the Spicepod registry made every PR's integration tests
          # depend on a remote service, and when that service started returning a
          # JSON error body under `Content-Type: application/zip`, every open PR
          # failed at once on "Failed to extract Spicepod archive: Could not find
          # EOCD". This is the same dataset spiceai/quickstart defines.
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          spiced &> spice.log &
          # Wait until the dataset is queryable, not merely until the runtime is up:
          # /v1/ready returns before an accelerated dataset finishes loading, which
          # races the tests into "table 'taxi_trips' not found".
          for i in {1..120}; do
            if curl -s -X POST http://localhost:8090/v1/sql \
                 -d 'SELECT count(*) AS n FROM taxi_trips' 2>/dev/null | grep -q '"n"'; then
              echo "Spice runtime is ready and taxi_trips is queryable"
              break
            fi
            echo "Waiting for Spice runtime and taxi_trips... ($i/120)"
            sleep 1
          done

      # A second runtime secured with an API key, for
      # tests/test_integration_auth.py. OSS accepts the key only as a Bearer
      # header, so this covers the auth path every SDK call must use. The key is
      # a throwaway for this local runtime, not a secret. On Windows it runs in
      # WSL; see the Windows steps below.
      - name: Start API-key-secured spice runtime (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p spice_auth
          cd spice_auth
          cat > spicepod.yaml <<'YAML'
          version: v1
          kind: Spicepod
          name: spicepy_auth
          runtime:
            auth:
              api-key:
                enabled: true
                keys: [ "spicepy-ci-key" ]
          YAML
          spiced --http 127.0.0.1:18090 --flight 127.0.0.1:50061 --node-bind-address 127.0.0.1:50062 &> spice.log &
          for i in {1..60}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/v1/ready)" = 200 ]; then
              echo "API-key-secured runtime is ready"
              echo "SPICE_AUTH_FLIGHT_URL=grpc://127.0.0.1:50061" >> "$GITHUB_ENV"
              echo "SPICE_AUTH_HTTP_URL=http://127.0.0.1:18090" >> "$GITHUB_ENV"
              echo "SPICE_AUTH_API_KEY=spicepy-ci-key" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for API-key-secured runtime... ($i/60)"
            sleep 1
          done
          cat spice.log
          echo "API-key-secured runtime did not become ready within 60 seconds"
          exit 1

      # A third runtime serving TLS with a certificate from a throwaway private
      # CA, for tests/test_integration_tls.py: every call must verify against
      # tls_root_cert alone, not the system or certifi bundle. Throwaway
      # certificates generated here, valid for one day, not secrets.
      - name: Start TLS spice runtime with a private CA (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p spice_tls/certs
          cd spice_tls/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 1 \
            -subj "/CN=spicepy CI CA" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile ext.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -keyout wrongca.key -out wrongca.pem -days 1 -subj "/CN=spicepy CI wrong CA"
          cd ..
          cat > spicepod.yaml <<'YAML'
          version: v1
          kind: Spicepod
          name: spicepy_tls
          runtime:
            auth:
              api-key:
                enabled: true
                keys: [ "spicepy-tls-key:rw" ]
            tls:
              enabled: true
              certificate_file: ./certs/server.pem
              key_file: ./certs/server.key
          datasets:
            - from: memory:store
              name: tls_mem
              access: read_write
          YAML
          spiced --http 127.0.0.1:18443 --flight 127.0.0.1:50071 --metrics 127.0.0.1:19091 --node-bind-address 127.0.0.1:50072 &> spice.log &
          for i in {1..60}; do
            if curl -sf --cacert certs/ca.pem https://127.0.0.1:18443/v1/ready > /dev/null; then
              echo "TLS runtime is ready"
              echo "SPICE_TLS_FLIGHT_URL=grpc+tls://127.0.0.1:50071" >> "$GITHUB_ENV"
              echo "SPICE_TLS_HTTP_URL=https://127.0.0.1:18443" >> "$GITHUB_ENV"
              echo "SPICE_TLS_API_KEY=spicepy-tls-key" >> "$GITHUB_ENV"
              echo "SPICE_TLS_ROOT_CERT=$PWD/certs/ca.pem" >> "$GITHUB_ENV"
              echo "SPICE_TLS_WRONG_CA=$PWD/certs/wrongca.pem" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for TLS runtime... ($i/60)"
            sleep 1
          done
          cat spice.log
          echo "TLS runtime did not become ready within 60 seconds"
          exit 1

      - name: Init and start spice app (Windows)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.spice/bin:$PATH"
          spice init spice_qs
          cd spice_qs
          # Inline dataset rather than a registry fetch — see the non-Windows step.
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          nohup spiced > spice.log 2>&1 &
          # Wait until the dataset is queryable — see the non-Windows step.
          for i in $(seq 1 180); do
            if curl -s -X POST http://localhost:8090/v1/sql \
                 -d 'SELECT count(*) AS n FROM taxi_trips' 2>/dev/null | grep -q '"n"'; then
              echo "Spice runtime is ready and taxi_trips is queryable"
              exit 0
            fi
            echo "Waiting for Spice runtime and taxi_trips... ($i/180)"
            sleep 1
          done
          echo "=== spice log ==="
          cat spice.log || true
          echo "taxi_trips did not become queryable within 180 seconds"
          exit 1

      # Same API-key-secured runtime as on Linux and macOS, inside WSL. The
      # host-side step below exports SPICE_AUTH_* once its Flight port is
      # reachable from Windows (a WSL step can't write $GITHUB_ENV).
      - name: Start API-key-secured spice runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.spice/bin:$PATH"
          mkdir -p spice_auth
          cd spice_auth
          cat > spicepod.yaml <<'YAML'
          version: v1
          kind: Spicepod
          name: spicepy_auth
          runtime:
            auth:
              api-key:
                enabled: true
                keys: [ "spicepy-ci-key" ]
          YAML
          nohup spiced --http 127.0.0.1:18090 --flight 127.0.0.1:50061 --node-bind-address 127.0.0.1:50062 > spice.log 2>&1 &
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/v1/ready)" = 200 ]; then
              echo "API-key-secured runtime is ready"
              exit 0
            fi
            echo "Waiting for API-key-secured runtime... ($i/60)"
            sleep 1
          done
          cat spice.log || true
          echo "API-key-secured runtime did not become ready within 60 seconds"
          exit 1

      # The Windows readiness poll above runs inside WSL and only checks the
      # HTTP port (8090). WSL2 forwards ports to the Windows host asynchronously,
      # so 8090-ready in WSL does not guarantee the host can reach the Flight
      # port (50051) yet — the tests run on the host and hit 50051, which raced
      # into "connection refused". Gate the tests on host-side Flight reachability.
      - name: Wait for Flight endpoint from host (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          python - <<'PY'
          import socket, sys, time
          # 50051: the main runtime. 50061: the API-key-secured runtime.
          for port in (50051, 50061):
              for i in range(60):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=2):
                          print(f"Flight port {port} reachable from host")
                          break
                  except OSError:
                      print(f"waiting for Flight {port} from host... ({i + 1}/60)")
                      time.sleep(1)
              else:
                  sys.exit(f"Flight port {port} never became reachable from host")
          PY
          echo "SPICE_AUTH_FLIGHT_URL=grpc://127.0.0.1:50061" >> "$GITHUB_ENV"
          echo "SPICE_AUTH_HTTP_URL=http://127.0.0.1:18090" >> "$GITHUB_ENV"
          echo "SPICE_AUTH_API_KEY=spicepy-ci-key" >> "$GITHUB_ENV"

      - name: Running tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          # run spice.ai cloud tests only on linux with single python version, to avoid concurrent requests
          TEST_SPICE_CLOUD: 'false'
        run: |
          pytest -s tests/test_main.py tests/test_integration_local.py tests/test_integration_auth.py tests/test_integration_tls.py -k "not cloud"

      - name: Stop spice and check logs
        working-directory: spice_qs
        if: matrix.os != 'windows-latest' && always()
        run: |
          killall spice || true
          cat spice.log
          echo "=== API-key-secured runtime log ==="
          cat ../spice_auth/spice.log || true

      - name: Stop spice and check logs (Windows)
        if: matrix.os == 'windows-latest' && always()
        shell: wsl-bash {0}
        run: |
          pkill -f spiced || true
          echo "=== spice log ==="
          cat spice_qs/spice.log || true
          echo "=== API-key-secured runtime log ==="
          cat spice_auth/spice.log || true

  pytest-cloud:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    name: Cloud tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test,params]"
      - name: Run cloud tests
        env:
          SPICE_API_KEY: ${{ secrets.SCP_SPICEAI_TPCH_API_KEY }}
          TEST_SPICE_CLOUD: 'true'
        run: |
          pytest -s tests/test_main.py -k "cloud"

  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Test coverage (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test]"
      - name: Run coverage
        run: |
          pytest --cov=spicepy --cov-report=xml --cov-report=term-missing -m "unit or not (integration or cloud or slow)" --ignore=tests/test_main.py tests/
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
