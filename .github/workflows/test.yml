name: Test code base

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
      - release-*
    tags:
      - v*

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_pip_install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Test pip install (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pip install
        run: |
          pip install .

  pytest-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Unit tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test]"
      - name: Run unit tests
        run: |
          pytest -s -m "unit or not (integration or cloud or slow)" --ignore=tests/test_main.py tests/

  pytest-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Integration tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test]"

      # Linux and macOS both use the official cross-platform installer. The
      # Homebrew formula's post-install ("Upgrading Spice Runtime...") fails
      # intermittently on macOS runners, so brew is avoided here entirely.
      - name: Install Spice (https://install.spiceai.org) (Linux & macOS)
        if: matrix.os != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The installer download/extract flakes intermittently on CI runners,
          # so retry the two network steps before giving up (-f fails on HTTP errors).
          retry() {
            local n=1
            until "$@"; do
              [ $n -ge 3 ] && { echo "'$*' failed after $n attempts" >&2; return 1; }
              echo "attempt $n of '$*' failed; retrying in 5s..." >&2
              n=$((n + 1)); sleep 5
            done
          }
          retry bash -c 'curl -fsSL https://install.spiceai.org | bash'
          echo "$HOME/.spice/bin" >> $GITHUB_PATH
          retry "$HOME/.spice/bin/spice" install

      # Spice on Windows is only supported via WSL. Set up Ubuntu under WSL
      # and install Spice there; the tests on the Windows host then talk to
      # the runtime over localhost (WSL2 forwards localhost between host and
      # guest).
      - name: Set up WSL (Windows)
        if: matrix.os == 'windows-latest'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: |
            curl
            ca-certificates

      - name: install Spice in WSL (Windows)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry the install: the download/extract flakes intermittently in WSL
          # ("Failed to extract archive"). -f makes curl fail on HTTP errors.
          retry() {
            local n=1
            until "$@"; do
              [ $n -ge 3 ] && { echo "'$*' failed after $n attempts" >&2; return 1; }
              echo "attempt $n of '$*' failed; retrying in 5s..." >&2
              n=$((n + 1)); sleep 5
            done
          }
          retry bash -c 'curl -fsSL https://install.spiceai.org | bash'
          retry "$HOME/.spice/bin/spice" install

      - name: Init and start spice app
        if: matrix.os != 'windows-latest'
        run: |
          spice init spice_qs
          cd spice_qs
          # Define the dataset inline instead of `spice add spiceai/quickstart`.
          # Pulling it from the Spicepod registry made every PR's integration tests
          # depend on a remote service, and when that service started returning a
          # JSON error body under `Content-Type: application/zip`, every open PR
          # failed at once on "Failed to extract Spicepod archive: Could not find
          # EOCD". This is the same dataset spiceai/quickstart defines.
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          spiced &> spice.log &
          # Wait until the dataset is queryable, not merely until the runtime is up:
          # /v1/ready returns before an accelerated dataset finishes loading, which
          # races the tests into "table 'taxi_trips' not found".
          for i in {1..120}; do
            if curl -s -X POST http://localhost:8090/v1/sql \
                 -d 'SELECT count(*) AS n FROM taxi_trips' 2>/dev/null | grep -q '"n"'; then
              echo "Spice runtime is ready and taxi_trips is queryable"
              break
            fi
            echo "Waiting for Spice runtime and taxi_trips... ($i/120)"
            sleep 1
          done

      - name: Init and start spice app (Windows)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.spice/bin:$PATH"
          spice init spice_qs
          cd spice_qs
          # Inline dataset rather than a registry fetch — see the non-Windows step.
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          nohup spiced > spice.log 2>&1 &
          # Wait until the dataset is queryable — see the non-Windows step.
          for i in $(seq 1 180); do
            if curl -s -X POST http://localhost:8090/v1/sql \
                 -d 'SELECT count(*) AS n FROM taxi_trips' 2>/dev/null | grep -q '"n"'; then
              echo "Spice runtime is ready and taxi_trips is queryable"
              exit 0
            fi
            echo "Waiting for Spice runtime and taxi_trips... ($i/180)"
            sleep 1
          done
          echo "=== spice log ==="
          cat spice.log || true
          echo "taxi_trips did not become queryable within 180 seconds"
          exit 1

      # The Windows readiness poll above runs inside WSL and only checks the
      # HTTP port (8090). WSL2 forwards ports to the Windows host asynchronously,
      # so 8090-ready in WSL does not guarantee the host can reach the Flight
      # port (50051) yet — the tests run on the host and hit 50051, which raced
      # into "connection refused". Gate the tests on host-side Flight reachability.
      - name: Wait for Flight endpoint from host (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          python - <<'PY'
          import socket, sys, time
          for i in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 50051), timeout=2):
                      print("Flight port 50051 reachable from host")
                      sys.exit(0)
              except OSError:
                  print(f"waiting for Flight 50051 from host... ({i + 1}/60)")
                  time.sleep(1)
          sys.exit("Flight port 50051 never became reachable from host")
          PY

      - name: Running tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          # run spice.ai cloud tests only on linux with single python version, to avoid concurrent requests
          TEST_SPICE_CLOUD: 'false'
        run: |
          pytest -s tests/test_main.py -k "not cloud"

      - name: Stop spice and check logs
        working-directory: spice_qs
        if: matrix.os != 'windows-latest' && always()
        run: |
          killall spice || true
          cat spice.log

      - name: Stop spice and check logs (Windows)
        if: matrix.os == 'windows-latest' && always()
        shell: wsl-bash {0}
        run: |
          pkill -f spiced || true
          echo "=== spice log ==="
          cat spice_qs/spice.log || true

  pytest-cloud:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    name: Cloud tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test,params]"
      - name: Run cloud tests
        env:
          SPICE_API_KEY: ${{ secrets.SCP_SPICEAI_TPCH_API_KEY }}
          TEST_SPICE_CLOUD: 'true'
        run: |
          pytest -s tests/test_main.py -k "cloud"

  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Test coverage (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install ".[test]"
      - name: Run coverage
        run: |
          pytest --cov=spicepy --cov-report=xml --cov-report=term-missing --ignore=tests/test_main.py tests/
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
